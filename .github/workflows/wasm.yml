name: WasmJS CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  test:
    name: WasmJS Node Tests
    # ubuntu-latest is sufficient for Wasm Node tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run WasmJS Node Tests
        # This currently proves that the project configures and compiles, and nothing more: every
        # wasm test task is guarded by `onlyIf { <CPython Emscripten build>.exists() }`, and that
        # build is an unpublished local directory named by `-PwasmPythonDir`. On a runner it is
        # absent, so the task SKIPs and reports green having run zero tests.
        #
        # `wasmJsBrowserTest` is deliberately *not* added here, for the same reason -- it would be a
        # second task that can only skip, while advertising browser coverage that does not exist.
        # Both become worth wiring the moment the wasm CPython build is a published artefact
        # (ROADMAP §10, first open item). Until then the browser evidence is local; see ROADMAP §10c.
        run: ./gradlew :python-multiplatform:wasmJsNodeTest --console=plain
